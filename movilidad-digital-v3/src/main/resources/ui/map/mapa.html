<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    
	<script>
	        var map = L.map('map', {
	            zoomControl: true,
	            fadeAnimation: false,
	            zoomAnimation: false
	        }).setView([-42.7692, -65.0385], 13); // Puerto Madryn

	        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
	            maxZoom: 19,
	            attribution: '© OpenStreetMap contributors'
	        }).addTo(map);

	        // Forzar la recarga de mosaicos de manera progresiva para asegurar que carguen todos
	        [100, 300, 600, 1000, 1500].forEach(function(delay) {
	            setTimeout(function() {
	                map.invalidateSize(true);
	            }, delay);
	        });

	        window.addEventListener('resize', function() {
	            map.invalidateSize(true);
	        });
	    </script>
</body>
</html>
