<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Mapa Movilidad Digital</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar el mapa centrado en Puerto Madryn (o las coordenadas que prefieras)
        var map = L.map('map').setView([-42.7692, -65.0385], 13);

        // Capa de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Función global para que Java pueda llamar y trazar rutas más adelante
        function trazarRuta(lat1, lon1, lat2, lon2) {
            // Aquí luego agregaremos la lógica de la ruta
            L.marker([lat1, lon1]).addTo(map).bindPopup('Origen').openPopup();
            L.marker([lat2, lon2]).addTo(map).bindPopup('Destino');
        }
    </script>
</body>
</html>
