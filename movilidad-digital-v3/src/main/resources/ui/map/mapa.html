<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
    </style>
</head>

<body>

    <div id="map"></div>
	<script>
	        window.L_DISABLE_3D = true;
	    </script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        var map = L.map('map', {
            zoomControl: true,
            fadeAnimation: false,
            zoomAnimation: false
        }).setView([-42.7692, -65.0385], 13);

        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }
        ).addTo(map);

        var markerOrigen = null;
        var markerDestino = null;
        var polylineRuta = null;

        function trazarRuta(latOrigen, lonOrigen,
                            latDestino, lonDestino) {

            if (markerOrigen) {
                map.removeLayer(markerOrigen);
            }

            if (markerDestino) {
                map.removeLayer(markerDestino);
            }

            if (polylineRuta) {
                map.removeLayer(polylineRuta);
            }

            markerOrigen = L.marker([latOrigen, lonOrigen])
                .addTo(map)
                .bindPopup("<b>Origen del Viaje</b>");

            markerDestino = L.marker([latDestino, lonDestino])
                .addTo(map)
                .bindPopup("<b>Destino del Viaje</b>");

            var latlngs = [
                [latOrigen, lonOrigen],
                [latDestino, lonDestino]
            ];

            polylineRuta = L.polyline(latlngs, {
                color: '#2a5298',
                weight: 5,
                opacity: 0.8
            }).addTo(map);

            map.fitBounds(L.latLngBounds(latlngs), {
                padding: [50, 50]
            });

            map.invalidateSize(true);
        }

        // Función que puede invocarse desde JavaFX
        function actualizarTamanoMapa() {
            map.invalidateSize(true);
        }

        window.addEventListener('resize', function() {
            actualizarTamanoMapa();
        });

    </script>

</body>
</html>
